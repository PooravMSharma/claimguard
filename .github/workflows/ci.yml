# Runs on every push and pull request: lint, types, the full test suite and the dashboard build.
# Uses throwaway Postgres and Redis containers; no secrets and no AI provider are needed (tests use fakes).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimguard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: claimguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimguard" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://claimguard:ci-only-password@localhost:5432/claimguard
      REDIS_URL: redis://localhost:6379/0
      STORAGE_LOCAL_PATH: /tmp/claimguard-storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin
      - name: Python packages
        run: pip install -r requirements.txt ruff==0.8.4 pyright==1.1.390
      - name: Ruff
        run: ruff check app tests
      - name: Pyright
        run: pyright
      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build          # tsc --noEmit + vite build