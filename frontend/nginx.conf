# ClaimGuard dashboard + API proxy (production image).
# Put this behind HTTPS (a load balancer, Caddy or certbot): outside development the login cookie is Secure, so
# sign-in only works over https://.

server_tokens off;

# Claim uploads: up to 100 MB per claim (MAX_CLAIM_BYTES) plus form overhead
client_max_body_size 110m;

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # The API sets its own security headers; nginx adds none here so they are not doubled.
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite: a client cannot fake its address
                                                            # (behind a load balancer, set real_ip_header)
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;          # running checks on a large claim
        proxy_request_buffering off;      # stream uploads instead of buffering 100 MB on disk first
    }

    # Built files have a content hash in their name: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
        expires -1;                       # index.html always fresh, so a new build is picked up at once
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
